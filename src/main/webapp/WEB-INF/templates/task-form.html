<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Create Task | Employee Management System</title><link rel="stylesheet" th:href="@{/css/styles.css}"></head>
<body><nav class="top-nav"><a th:href="@{/dashboard}" class="nav-brand"><span class="brand-icon">🏢</span><span>Employee Projects</span></a><div class="nav-right"><a th:href="@{/tasks}" class="nav-link">Task board</a><a th:href="@{/logout}" class="nav-link logout-link">Logout</a></div></nav>
<main class="main-content narrow-content"><div class="page-header"><h1>Create task</h1><p class="page-subtitle">Add a deliverable, choose its priority, and assign an owner.</p></div><div th:if="${error != null}" class="alert alert-error" th:text="${error}"></div>
<form th:action="@{/tasks/save}" method="post" class="form-card">
<div class="form-group"><label for="title">Task title *</label><input id="title" name="title" required maxlength="150" placeholder="e.g. Prepare launch review"></div>
<div class="form-group"><label for="description">Description</label><textarea id="description" name="description" rows="4" maxlength="2000" placeholder="What needs to be delivered?"></textarea></div>
<div class="form-row"><div class="form-group"><label for="projectId">Project *</label><select id="projectId" name="projectId" required><option value="">Choose a project</option><option th:each="project : ${projects}" th:value="${project.id}" th:text="${project.projectName}"></option></select></div><div class="form-group"><label for="assigneeId">Assignee</label><select id="assigneeId" name="assigneeId"><option value="">Unassigned</option><option th:each="employee : ${employees}" th:value="${employee.id}" th:text="${employee.name + ' · ' + employee.designation}"></option></select></div></div>
<div class="form-row"><div class="form-group"><label for="priority">Priority</label><select id="priority" name="priority"><option value="low">Low</option><option value="medium" selected>Medium</option><option value="high">High</option></select></div><div class="form-group"><label for="dueDate">Due date</label><input type="date" id="dueDate" name="dueDate"></div><div class="form-group"><label for="status">Initial status</label><select id="status" name="status"><option value="todo">To do</option><option value="in progress">In progress</option><option value="done">Done</option></select></div></div>
<div class="form-actions"><a th:href="@{/tasks}" class="btn btn-secondary">Cancel</a><button type="submit" class="btn btn-primary">Create task</button></div></form></main><footer class="footer"><p>&copy; 2026 Employee Management System.</p></footer></body></html>
