<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${project.id > 0} ? 'Update Project' : 'Add Project'">Project Form</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<!-- Top Navigation -->
<nav class="top-nav">
    <a th:href="@{/dashboard}" class="nav-brand">
        <span class="brand-icon">🏢</span>
        <span>EMS</span>
    </a>
    <div class="nav-right">
        <div class="nav-user">
            <div class="user-avatar" th:text="${#strings.substring(session.userName, 0, 1)}">U</div>
            <span th:text="${session.userName}">User</span>
            <span class="user-role" th:text="${session.userRole}">role</span>
        </div>
        <a th:href="@{/dashboard}" class="nav-link">Dashboard</a>
        <a th:href="@{/projects}" class="nav-link">Projects</a>
        <a th:href="@{/logout}" class="nav-link logout-link">Logout</a>
    </div>
</nav>

<!-- Main Content -->
<div class="main-content">
    <div class="breadcrumb">
        <a th:href="@{/dashboard}">Dashboard</a>
        <span class="separator">›</span>
        <a th:href="@{/projects}">Projects</a>
        <span class="separator">›</span>
        <span th:text="${project.id > 0} ? 'Update' : 'Add New'">Add New</span>
    </div>

    <div class="page-header">
        <h1 th:text="${project.id > 0} ? '📋 Update Project' : '📋 Add New Project'">Add Project</h1>
        <p class="page-subtitle" th:text="${project.id > 0} ? 'Modify project details below' : 'Fill in the details to create a new project'">Fill in project details</p>
    </div>

    <div class="card card-narrow">
        <div th:if="${error != null}" class="alert alert-error">
            <span class="alert-icon">⚠️</span>
            <span th:text="${error}"></span>
        </div>

        <form method="post"
              th:action="${project.id > 0} ? @{/projects/update} : @{/projects/save}"
              th:object="${project}">

            <input type="hidden" th:if="${project.id > 0}" th:field="*{id}">

            <div class="form-group">
                <label for="projectName">Project Name</label>
                <input id="projectName" type="text" th:field="*{projectName}" placeholder="Enter project name" required>
            </div>

            <div class="form-group">
                <label for="clientName">Client Name</label>
                <input id="clientName" type="text" th:field="*{clientName}" placeholder="Enter client name">
            </div>

            <div class="form-grid-2col">
                <div class="form-group">
                    <label for="startDate">Start Date</label>
                    <input id="startDate" type="date" th:field="*{startDate}">
                </div>
                <div class="form-group">
                    <label for="budget">Budget</label>
                    <input id="budget" type="number" th:field="*{budget}" step="0.01" min="0" placeholder="0.00">
                </div>
            </div>

            <div class="form-grid-2col">
                <div class="form-group">
                    <label for="maximumTeamSize">Maximum Team Size</label>
                    <input id="maximumTeamSize" type="number" th:field="*{maximumTeamSize}" min="0" placeholder="e.g. 10">
                </div>
                <div class="form-group">
                    <label for="status">Status</label>
                    <select id="status" th:field="*{status}">
                        <option value="" disabled>-- Select Status --</option>
                        <option value="planned">Planned</option>
                        <option value="active">Active</option>
                        <option value="completed">Completed</option>
                    </select>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary" th:text="${project.id > 0} ? '💾 Save Changes' : '💾 Add Project'">Add Project</button>
                <a th:href="@{/projects}" class="btn btn-outline">Cancel</a>
            </div>
        </form>
    </div>
</div>

<!-- Footer -->
<footer class="footer">
    <p>&copy; 2025 Employee Management System. All rights reserved.</p>
</footer>
</body>
</html>
