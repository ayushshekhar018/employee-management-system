name: Java CI

on:
  push:
    branches:
      - master
      - deploy/render-tidb
  pull_request:
    branches:
      - master
      - deploy/render-tidb

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build and run tests
        run: mvn --batch-mode --no-transfer-progress clean verify
